name: Deploy microsite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workshop content
        run: |
          node scripts/validate-content.mjs
          node scripts/validate-catalog-request.mjs workshop/catalog/valid-request.json
          if node scripts/validate-catalog-request.mjs workshop/catalog/unsafe-request.json; then exit 1; fi

      - name: Build and test Functions sample
        working-directory: workshop/functions
        run: |
          npm ci
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
